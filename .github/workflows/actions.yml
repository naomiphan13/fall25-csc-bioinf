name: Github CI
on: [push]

defaults:
  run:
    shell: bash -l {0}
    
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - run: echo "🎉 The job was automatically triggered by a ${{ github.event_name }} event."
      - run: echo "🐧 This job is now running on a ${{ runner.os }} server hosted by GitHub!"
      - run: echo "🔎 The name of your branch is ${{ github.ref }} and your repository is ${{ github.repository }}."
      - uses: actions/checkout@v5
      
      - uses: mamba-org/setup-micromamba@v1
        with:
          micromamba-version: latest
          environment-name: bio
          cache-environment: true
          create-args: >
            -c conda-forge -c bioconda
            samtools=1.22.1 bcftools=1.22 jupyter nbconvert
            
      - name: Install system build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            autoconf automake libtool pkg-config \
            zlib1g-dev libbz2-dev liblzma-dev libcurl4-openssl-dev \
            build-essential wget unzip bzip2

      - name: Install Minimap2
        run: |
          MINIMAP2_VER="2.30"
          wget -q "https://github.com/lh3/minimap2/releases/download/v${MINIMAP2_VER}/minimap2-${MINIMAP2_VER}_x64-linux.tar.bz2"
          tar -xjf "minimap2-${MINIMAP2_VER}_x64-linux.tar.bz2"
          sudo mv "minimap2-${MINIMAP2_VER}_x64-linux/minimap2" /usr/local/bin/
          minimap2 --version

      - name: Install HapCUT2 and htslib
        run: |
          set -euo pipefail
          mkdir -p "$HOME/HapCUT2"
          git clone --depth 1 https://github.com/vibansal/HapCUT2.git "$HOME/HapCUT2"
          cd "$HOME/HapCUT2"

          git clone --depth 1 https://github.com/samtools/htslib.git
          cd htslib
          git submodule update --init --recursive
          autoreconf -i
          ./configure
          make
          cd ..

          export LD_LIBRARY_PATH="$(pwd)/htslib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          make

          echo "$HOME/HapCUT2/build" >> "$GITHUB_PATH"
          echo "LD_LIBRARY_PATH=$LD_LIBRARY_PATH:$HOME/HapCUT2/htslib" >> "$GITHUB_ENV"

      - name: Install IGV Desktop
        run: |
          IGV_VER="2.19.7"
          wget -q "https://data.broadinstitute.org/igv/projects/downloads/2.19/IGV_${IGV_VER}.zip"
          unzip -q "IGV_${IGV_VER}.zip"
          rm -f "IGV_${IGV_VER}.zip"
          chmod +x "$HOME/IGV_${IGV_VER}/igv.sh" || true

      - name: Week 5
        run: |
          micromamba run -n bio jupyter nbconvert --to notebook --execute week5/week5.ipynb
