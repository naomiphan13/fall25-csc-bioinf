name: Github CI
on: [push]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - run: echo "🎉 The job was automatically triggered by a ${{ github.event_name }} event."
      - run: echo "🐧 This job is now running on a ${{ runner.os }} server hosted by GitHub!"
      - run: echo "🔎 The name of your branch is ${{ github.ref }} and your repository is ${{ github.repository }}."

      - name: Install system build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            autoconf automake libtool pkg-config \
            zlib1g-dev libbz2-dev liblzma-dev libcurl4-openssl-dev \
            build-essential wget unzip

      - name: Install Minimap2
        run: |
          MINIMAP2_VER="2.30"
          wget -q "https://github.com/lh3/minimap2/releases/download/v${MINIMAP2_VER}/minimap2-${MINIMAP2_VER}_x64-linux.tar.bz2"
          tar -xjf "minimap2-${MINIMAP2_VER}_x64-linux.tar.bz2"
          sudo mv "minimap2-${MINIMAP2_VER}_x64-linux/minimap2" /usr/local/bin/
          minimap2 --version

      - name: Install HapCUT2 and htslib
        run: |
          wget -q "https://github.com/vibansal/HapCUT2.git"
          cd HapCUT2
          wget -q "https://github.com/samtools/htslib.git"
          cd htslib

          autoreconf -i
          ./configure
          make
          cd ..
          export LD_LIBRARY_PATH="$LD_LIBRARY_PATH:$(pwd)/htslib"
          make

      - name: Install IGV Desktop
        run: |
          IGV_VER="2.19.7"
          wget -q "https://data.broadinstitute.org/igv/projects/downloads/2.19/IGV_${IGV_VER}.zip"
          unzip -q "IGV_${IGV_VER}.zip"
          rm -f "IGV_${IGV_VER}.zip"
          chmod +x "$HOME/IGV_${IGV_VER}/igv.sh" || true

      - name: Check out repository code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install Python dependencies
        env:
          MPLBACKEND: Agg
          PIP_DISABLE_PIP_VERSION_CHECK: 1
        run: |
          python -m pip install -U pip
          pip install -r requirements.txt
          pip install jupyter nbclient

      - name: Week 5
        run: |
          jupyter nbconvert --to notebook --execute week5/week5.ipynb
